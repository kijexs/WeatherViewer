on:
  pull_request:
    - workflows: kotlin-ci-workflow
      filter:
        source_branches: "**"
        target_branches: "main"
        paths:
          - "**.kt"
          - "**.kts"
          - "build.gradle.kts"
          - "gradle/**"
  push:
    - workflows: kotlin-ci-workflow
      filter:
        branches: "**"

workflows:
  kotlin-ci-workflow:
    tasks:
      - name: assemble-and-test
        cubes:
          - name: test-cube
            image: cirrusci/android-sdk:30
            script:
              - ./gradlew build
              - ./gradlew test
              - ./gradlew detekt
              - ./gradlew ktlintCheck 
